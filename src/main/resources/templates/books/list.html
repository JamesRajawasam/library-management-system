<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Library Catalog</h4>
            <a th:href="@{/books/new}" class="btn btn-success btn-sm">+ Add New Book</a>
        </div>
        <div class="card-body">
            <form th:action="@{/books}" method="get" class="row g-2 mb-4">
                <div class="col-md-10">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search by title, author, or ISBN..." />
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100">Search</button>
                    <a th:href="@{/books}" class="btn btn-outline-secondary">Reset</a>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>ISBN</th>
                            <th>Category</th>
                            <th>Total</th>
                            <th>Available</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="book : ${books}">
                            <td th:text="${book.id}">1</td>
                            <td class="fw-bold" th:text="${book.title}">Book Title</td>
                            <td th:text="${book.author}">Author</td>
                            <td th:text="${book.isbn}">ISBN</td>
                            <td>
                                <span class="badge bg-secondary" th:text="${book.category != null ? book.category.name : 'Uncategorized'}">Category</span>
                            </td>
                            <td th:text="${book.totalCopies}">1</td>
                            <td>
                                <span class="badge" th:classappend="${book.availableCopies > 0 ? 'bg-success' : 'bg-danger'}" th:text="${book.availableCopies}">1</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-sm btn-outline-primary me-1">Edit</a>
                                <a th:href="@{/books/delete/{id}(id=${book.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this book?');">Delete</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(books)}">
                            <td colspan="8" class="text-center text-muted py-4">No books found in the library catalog.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
