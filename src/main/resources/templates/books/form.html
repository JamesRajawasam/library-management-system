<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Record Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0" th:text="${book.id == null ? 'Add New Book' : 'Edit Book Record'}"></h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/books/save}" th:object="${book}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label">Book Title</label>
                            <input type="text" th:field="*{title}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{title}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Author</label>
                            <input type="text" th:field="*{author}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{author}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">ISBN</label>
                            <input type="text" th:field="*{isbn}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{isbn}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select th:field="*{category.categoryId}" class="form-select" th:errorclass="is-invalid">
                                <option value="">-- Select Category --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.name}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{category}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Total Copies</label>
                                <input type="number" th:field="*{totalCopies}" class="form-control" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{totalCopies}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Available Copies</label>
                                <input type="number" th:field="*{availableCopies}" class="form-control" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{availableCopies}"></div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/books}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success">Save Record</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
